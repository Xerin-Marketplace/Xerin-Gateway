# Add these locations INSIDE the existing server block for api.xerinmarketplace.com.
# They do not replace the current Xerin/FastAPI proxy configuration.

# Pesapal server-to-server notification endpoint.
location = /pesapal-demo/ipn {
    proxy_pass http://127.0.0.1:8502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /pesapal-demo/ipn/health {
    proxy_pass http://127.0.0.1:8502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Streamlit UI and its WebSocket/static traffic.
# IMPORTANT: no trailing slash on proxy_pass; Streamlit must receive /pesapal-demo/.
location /pesapal-demo/ {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}
